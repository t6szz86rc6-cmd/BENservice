<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BENservice</title>
<style>html,body{margin:0;background:#0f1115;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}#msg{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}</style>
</head>
<body>
<div id="msg">Uruchamianie BENservice…</div>
<script>
fetch('https://whwefclssucosdcmrucx.supabase.co/storage/v1/object/public/benservice-web/index.html',{cache:'no-store'})
.then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
.then(html=>{document.open();document.write(html);document.close()})
.catch(e=>{document.getElementById('msg').textContent='Nie udało się uruchomić BENservice: '+e.message})
</script>
</body>
</html>
