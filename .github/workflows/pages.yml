name: Deploy BENservice to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare BENservice
        run: |
          mkdir -p site
          cp index.html site/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8')
          old_new = "$('lines').innerHTML='';addLine();laborModeUi();"
          new_new = "$('lines').innerHTML='';laborModeUi();"
          old_edit = "if(!(r.data||[]).length)addLine();laborModeUi();"
          new_edit = "laborModeUi();"
          if old_new not in s:
              raise SystemExit('Nie znaleziono kodu pustej części dla nowego zlecenia')
          if old_edit not in s:
              raise SystemExit('Nie znaleziono kodu pustej części dla edycji zlecenia')
          s = s.replace(old_new, new_new, 1)
          s = s.replace(old_edit, new_edit, 1)
          p.write_text(s, encoding='utf-8')
          PY
          touch site/.nojekyll
          test -s site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
