name: Deploy BENservice to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare BENservice
        run: |
          mkdir -p site
          cp index.html site/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8')

          # Nowe/edytowane zlecenie: nie twórz pustej pozycji części automatycznie.
          old_new = "$('lines').innerHTML='';addLine();laborModeUi();"
          new_new = "$('lines').innerHTML='';laborModeUi();"
          old_edit = "if(!(r.data||[]).length)addLine();laborModeUi();"
          new_edit = "laborModeUi();"
          if old_new not in s:
              raise SystemExit('Nie znaleziono kodu pustej części dla nowego zlecenia')
          if old_edit not in s:
              raise SystemExit('Nie znaleziono kodu pustej części dla edycji zlecenia')
          s = s.replace(old_new, new_new, 1)
          s = s.replace(old_edit, new_edit, 1)

          # Karta zlecenia: przycisk Edytuj obok X.
          old_head = '<dialog id="orderInfoD"><div class="dialogHead"><h2>Karta zlecenia</h2><button type="button" class="dialogClose" onclick="orderInfoD.close()">×</button></div><div id="orderInfoBody"></div></dialog>'
          new_head = '<dialog id="orderInfoD"><div class="dialogHead"><h2>Karta zlecenia</h2><div style="display:flex;gap:8px;align-items:center"><button type="button" onclick="if(orderInfoD.dataset.orderId){let id=orderInfoD.dataset.orderId;orderInfoD.close();editOrder(id)}">Edytuj</button><button type="button" class="dialogClose" onclick="orderInfoD.close()">×</button></div></div><div id="orderInfoBody"></div></dialog>'
          if old_head not in s:
              raise SystemExit('Nie znaleziono nagłówka karty zlecenia')
          s = s.replace(old_head, new_head, 1)

          old_show = "async function showOrderInfo(id){let o=D.orders.find(x=>x.id===id);"
          new_show = "async function showOrderInfo(id){orderInfoD.dataset.orderId=id;let o=D.orders.find(x=>x.id===id);"
          if old_show not in s:
              raise SystemExit('Nie znaleziono funkcji podglądu zlecenia')
          s = s.replace(old_show, new_show, 1)

          p.write_text(s, encoding='utf-8')
          PY
          touch site/.nojekyll
          test -s site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
